<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Career Portfolio Template — repository social preview</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1280px; height: 640px; overflow: hidden; }
  body { background: #082849; color: #fff; font-family: Arial, Helvetica, sans-serif; }
  main { display: grid; grid-template-columns: 470px 1fr; align-items: center; gap: 34px; height: 100%; padding: 60px; }
  .eyebrow { margin: 0 0 28px; color: #80ded3; font-size: 17px; letter-spacing: 2.5px; text-transform: uppercase; }
  h1 { margin: 0 0 24px; font-size: 64px; line-height: 1.04; letter-spacing: -2px; }
  .description { margin: 0; color: #e1ebf3; font-size: 24px; line-height: 1.4; max-width: 430px; }
  .credit { margin: 46px 0 0; color: #b7cedf; font-size: 17px; }
  .preview { padding: 10px; background: #f5f8fa; border-radius: 16px; box-shadow: 0 20px 60px #0005; }
  img { display: block; width: 100%; border-radius: 8px; }
</style>
<main>
  <section>
    <p class="eyebrow">Next.js · TypeScript · MIT</p>
    <h1>Career Portfolio<br>Template</h1>
    <p class="description">A Next.js starter for your work, projects and story.</p>
    <p class="credit">By George Vasilakopoulos</p>
  </section>
  <div class="preview"><img src="template-home.jpg" alt="The real template home page, using the fictional Alex Example content."></div>
</main>
</html>
